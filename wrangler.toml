name = "bible-rss-reader"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# Custom domains
routes = [
  { pattern = "bibleplanfeed.com", custom_domain = true },
  { pattern = "www.bibleplanfeed.com", custom_domain = true }
]

# Static assets configuration
[assets]
directory = "./public"
# Exposes env.ASSETS to the Worker; without it, any non-feed request that
# isn't a static file throws and returns a 500
binding = "ASSETS"
# Serve public/404.html for unknown paths
not_found_handling = "404-page"
# With 404-page set, browser navigations to paths that aren't files get the
# 404 page without reaching the Worker, so feed routes must run it first
run_worker_first = ["/rssbible/*"]

# Development settings
[dev]
port = 8787

# Environment variables (optional)
[vars]
# ENVIRONMENT = "development"
